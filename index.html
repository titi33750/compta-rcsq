<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Compta RCSQ</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
body{margin:0;font-family:system-ui;background:#f4f7fb;color:#172033}header{background:#0b3d91;color:white;padding:18px}main{max-width:900px;margin:auto;padding:16px}.card{background:white;padding:16px;border-radius:16px;margin-bottom:14px;box-shadow:0 3px 15px #1232}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.metric b{display:block;font-size:22px}.btn{border:0;border-radius:10px;padding:12px;font-weight:700;margin:4px;background:#e7edf8}.primary{background:#0b3d91;color:white}.good{background:#16845b;color:white}.bad{background:#c63d3d;color:white}input,select,textarea{width:100%;padding:11px;margin:5px 0 10px;border:1px solid #ccd5e2;border-radius:9px;box-sizing:border-box}.hidden{display:none}table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid #eee;text-align:left}.dep{color:#c63d3d}.rec{color:#16845b}@media(max-width:650px){.grid{grid-template-columns:1fr 1fr}}
</style></head><body><header><h2>🏉 Compta RCSQ</h2><small>Exercice 2026-2027</small></header><main>
<section id="auth" class="card"><h2>Connexion 🔐</h2><div id="msg"></div><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Mot de passe"><button class="btn primary" onclick="login()">Connexion</button><button class="btn" onclick="signup()">Créer mon compte</button><p><small>Le premier compte créé devient administrateur.</small></p></section>
<section id="app" class="hidden"><div class="grid"><div class="card metric">Solde<b id="bal">0 €</b></div><div class="card metric">Recettes<b id="inc">0 €</b></div><div class="card metric">Dépenses<b id="exp">0 €</b></div><div class="card metric">Opérations<b id="cnt">0</b></div></div>
<div class="card"><button class="btn good" onclick="formOp('recette')">+ Recette</button><button class="btn bad" onclick="formOp('depense')">+ Dépense</button><button class="btn" onclick="load()">↻ Actualiser</button><button class="btn" onclick="logout()">Déconnexion</button></div>
<div id="form" class="card hidden"><h3 id="ft">Nouvelle opération</h3><select id="type"><option value="depense">Dépense</option><option value="recette">Recette</option></select><input id="date" type="date"><input id="label" placeholder="Libellé"><input id="third" placeholder="Tiers / fournisseur"><input id="amount" type="number" step=".01" min=".01" placeholder="Montant TTC"><select id="account"></select><select id="pay"><option>Carte bancaire</option><option>Virement</option><option>Chèque</option><option>Espèces</option><option>Prélèvement</option></select><textarea id="notes" placeholder="Notes"></textarea><label>Justificatif PDF / photo</label><input id="file" type="file" accept=".pdf,image/*"><button class="btn primary" onclick="save()">Enregistrer</button><div id="saveMsg"></div></div>
<div class="card"><h3>📖 Livre de comptes</h3><div style="overflow:auto"><table><thead><tr><th>Date</th><th>Pièce</th><th>Libellé</th><th>Montant</th></tr></thead><tbody id="rows"></tbody></table></div></div></section>
<script>
const sb=supabase.createClient('https://wrrwanpgvqozesdcqozl.supabase.co','sb_publishable_616PWlfFWgNPkfnhwnsRDw_qmzbvo-Q');let fy,acs=[],ents=[];
const eur=n=>new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR'}).format(n||0);
async function signup(){let r=await sb.auth.signUp({email:email.value,password:password.value});msg.textContent=r.error?r.error.message:'Compte créé. Confirme ton email si Supabase le demande, puis connecte-toi.'}
async function login(){let r=await sb.auth.signInWithPassword({email:email.value,password:password.value});msg.textContent=r.error?r.error.message:'';if(!r.error)boot()}
async function logout(){await sb.auth.signOut();location.reload()}
async function boot(){let s=(await sb.auth.getSession()).data.session;if(!s)return;auth.classList.add('hidden');app.classList.remove('hidden');await load()}
async function load(){fy=(await sb.from('fiscal_years').select('*').eq('is_active',true).single()).data;acs=(await sb.from('accounts').select('*').eq('active',true)).data||[];account.innerHTML=acs.map(x=>`<option value="${x.id}">${x.name}</option>`).join('');ents=(await sb.from('entries').select('*').order('entry_date',{ascending:false})).data||[];let i=ents.filter(x=>x.type==='recette').reduce((s,x)=>s+Number(x.amount),0),e=ents.filter(x=>x.type==='depense').reduce((s,x)=>s+Number(x.amount),0);inc.textContent=eur(i);exp.textContent=eur(e);bal.textContent=eur(i-e);cnt.textContent=ents.length;rows.innerHTML=ents.map(x=>`<tr><td>${x.entry_date}</td><td>${x.piece_number}</td><td>${safe(x.label)}</td><td class="${x.type==='depense'?'dep':'rec'}">${x.type==='depense'?'−':'+'}${eur(x.amount)}</td></tr>`).join('')}
function safe(s){return String(s||'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function formOp(t){form.classList.remove('hidden');type.value=t;ft.textContent=t==='depense'?'Nouvelle dépense':'Nouvelle recette';date.value=new Date().toISOString().slice(0,10)}
async function save(){saveMsg.textContent='Enregistrement…';let u=(await sb.auth.getUser()).data.user,p=(type.value==='depense'?'DEP':'REC')+'-26-27-'+String(Date.now()).slice(-6);let r=await sb.from('entries').insert({fiscal_year_id:fy.id,piece_number:p,entry_date:date.value,type:type.value,label:label.value,third_party:third.value||null,account_id:account.value||null,payment_method:pay.value,amount:Number(amount.value),notes:notes.value||null,status:'validee',created_by:u.id}).select().single();if(r.error){saveMsg.textContent='Erreur : '+r.error.message;return}let f=file.files[0];if(f){let path=`2026-2027/${r.data.id}/${Date.now()}-${f.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`,up=await sb.storage.from('justificatifs').upload(path,f);if(!up.error)await sb.from('attachments').insert({entry_id:r.data.id,storage_path:path,original_name:f.name,mime_type:f.type,size_bytes:f.size,uploaded_by:u.id})}saveMsg.textContent='✅ Opération enregistrée';form.classList.add('hidden');await load()}
sb.auth.onAuthStateChange((e,s)=>{if(s)boot()});boot();
</script></main></body></html>
