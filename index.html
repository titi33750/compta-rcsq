<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Diagnostic connexion • Compta RCSQ</title>
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17223b;background:#f3f6fc}
*{box-sizing:border-box} body{margin:0}
header{background:#123f8c;color:#fff;padding:28px 22px}
header h1{margin:0;font-size:31px} header p{margin:5px 0 0;font-size:17px}
main{max-width:560px;margin:38px auto;padding:0 18px}
.card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 12px 30px #183b7014}
h2{margin:0 0 24px;font-size:28px}
label{display:block;font-weight:700;margin:16px 0 7px}
input{width:100%;font-size:17px;padding:15px;border:1px solid #c8d1e2;border-radius:14px;background:#fff}
button{width:100%;margin-top:20px;border:0;border-radius:14px;padding:15px;font-size:17px;font-weight:800;background:#174ca6;color:white}
button:disabled{opacity:.55}
#status{margin-top:18px;padding:14px;border-radius:12px;background:#eef3fb;min-height:50px;white-space:pre-wrap}
.small{font-size:13px;color:#63708a;margin-top:16px;line-height:1.45}
.ok{background:#eaf8ef!important;color:#166534}.err{background:#fff0f0!important;color:#a51d2d}
</style>
</head>
<body>
<header><h1>🏉 Compta RCSQ</h1><p>Test de connexion Supabase</p></header>
<main><section class="card">
<h2>Connexion 🔐</h2>
<label for="loginEmail">E-mail</label>
<input id="loginEmail" type="email" autocomplete="username" inputmode="email">
<label for="loginPassword">Mot de passe</label>
<input id="loginPassword" type="password" autocomplete="current-password">
<button id="loginBtn" type="button">Connexion</button>
<div id="status">Diagnostic prêt. Appuie sur « Connexion ».</div>
<div class="small">Cette page ne modifie aucune donnée comptable. Elle sert uniquement à vérifier l’authentification.</div>
</section></main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function () {
  const URL = "https://wrrwanpgvqozesdcqozl.supabase.co";
  const KEY = "sb_publishable_616PWlfFWgNPkfnhwnsRDw_qmzbvo-Q";
  const status = document.getElementById("status");
  const btn = document.getElementById("loginBtn");

  function show(message, kind) {
    status.textContent = message;
    status.className = kind || "";
  }

  if (!window.supabase || !window.supabase.createClient) {
    show("ERREUR : la bibliothèque Supabase ne s'est pas chargée.", "err");
    return;
  }

  const client = window.supabase.createClient(URL, KEY);
  show("Supabase chargé ✅\nDiagnostic prêt. Appuie sur « Connexion ».", "ok");

  btn.addEventListener("click", async function () {
    const email = document.getElementById("loginEmail").value.trim();
    const password = document.getElementById("loginPassword").value;
    if (!email || !password) {
      show("Entre ton e-mail et ton mot de passe.", "err");
      return;
    }
    btn.disabled = true;
    show("Connexion en cours…");
    try {
      const { data, error } = await client.auth.signInWithPassword({ email, password });
      if (error) {
        show("Connexion refusée : " + error.message, "err");
      } else if (data && data.user) {
        show("CONNEXION RÉUSSIE ✅\nCompte authentifié. Le lien Supabase fonctionne.", "ok");
      } else {
        show("Réponse reçue, mais aucun utilisateur n'a été retourné.", "err");
      }
    } catch (e) {
      show("Erreur technique : " + (e && e.message ? e.message : String(e)), "err");
    } finally {
      btn.disabled = false;
    }
  });
})();
</script>
</body>
</html>
